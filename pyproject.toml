[project]
name = "nav-trust-c2"
version = "0.0.0"
description = "Human-on-the-loop mission control for simulated drones with GNSS-degradation awareness"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
# MAVSDK-Python moved its gRPC wrapper to `mavsdk-grpc` (import `mavsdk_grpc`);
# the `mavsdk` name from v4 is a different, native binding.
sim = ["mavsdk-grpc==4.0.5"]
# C2 backend (issue 10). Optional so the trust engine and its tests stay dependency-free.
c2 = ["fastapi>=0.115", "uvicorn[standard]>=0.30"]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.10", "pyyaml>=6", "types-PyYAML", "httpx>=0.27"]

[tool.setuptools]
packages = ["navtrust", "c2", "sim", "eval"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.ruff.lint.per-file-ignores]
# prose and table rows in the generated report
"eval/evaluate.py" = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["navtrust", "c2", "sim", "eval", "tests"]

[[tool.mypy.overrides]]
# mavsdk_grpc ships no py.typed marker
module = ["mavsdk_grpc", "mavsdk_grpc.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
